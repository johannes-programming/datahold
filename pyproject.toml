[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77.0",
]

[project]
authors = [
    { email = "johannes.programming@gmail.com", name = "Johannes" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "frozendict<3,>=2.4",
    "typing-extensions<5,>=4.6",
]
description = "This project wraps common mutable data-structures for inheritance with modification."
keywords = []
license = "MIT"
license-files = [
    "LICENSE.txt",
]
name = "datahold"
readme = "README.rst"
requires-python = ">=3.11"
version = "4.1.2"

[project.urls]
Download = "https://pypi.org/project/datahold/#files"
Index = "https://pypi.org/project/datahold/"
Source = "https://github.com/johannes-programming/datahold/"
Website = "https://datahold.johannes-programming.online/"

[tool.mypy]
files = [
    ".",
]
python_version = "3.11"
strict = true
